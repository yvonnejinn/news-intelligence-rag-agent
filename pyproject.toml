[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence-agent"
version = "0.1.0"
requires-python = ">=3.10"
description = "News classification and evidence retrieval with explicit evaluation"
readme = "README.md"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
nlp = ["torch>=2.2,<3", "transformers>=4.46,<5", "datasets>=3,<5", "accelerate>=1,<2", "sentence-transformers>=3,<6", "pyarrow>=15"]
retrieval = ["sentence-transformers>=3,<6", "faiss-cpu>=1.8,<2"]
app = ["streamlit>=1.35,<2", "google-genai>=1,<2", "feedparser>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
